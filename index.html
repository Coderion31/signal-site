<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SIGNAL</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: 'Inter', sans-serif;
    background: #000;
    color: #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    overflow: hidden;
  }

  .topbar {
    position: fixed;
    top: 0; left: 0; right: 0;
    display: flex;
    justify-content: flex-end;
    padding: 16px 20px;
    gap: 12px;
    z-index: 10;
  }
  .icon-btn {
    width: 38px; height: 38px;
    background: rgba(255,255,255,0.08);
    border: none;
    border-radius: 50%;
    color: #fff;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
  }
  .icon-btn svg { width: 20px; height: 20px; }

  .content {
    text-align: center;
    padding: 0 24px;
    max-width: 480px;
  }

  .brand {
    font-family: 'Caveat', cursive;
    font-size: 64px;
    font-weight: 600;
    background: linear-gradient(90deg, #6fa8ff, #3b82f6);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    letter-spacing: 2px;
    margin-bottom: 8px;
    user-select: none;
  }

  .logo {
    margin: 16px auto 0;
    width: 200px; height: 150px;
    background: url('mascot.svg');
    background-size: 800% 600%;
    animation: mascot 3.2s steps(1) infinite;
    filter: invert(1);
  }
  @keyframes mascot {
    0% { background-position: 0% 0%; }
    1% { background-position: 14.286% 0%; }
    2% { background-position: 28.571% 0%; }
    3% { background-position: 42.857% 0%; }
    4% { background-position: 57.143% 0%; }
    5% { background-position: 71.429% 0%; }
    6% { background-position: 85.714% 0%; }
    7% { background-position: 100% 0%; }
    8% { background-position: 0% 20%; }
    9% { background-position: 14.286% 20%; }
    10% { background-position: 28.571% 20%; }
    11% { background-position: 42.857% 20%; }
    12% { background-position: 57.143% 20%; }
    13% { background-position: 71.429% 20%; }
    14% { background-position: 85.714% 20%; }
    15% { background-position: 100% 20%; }
    16% { background-position: 0% 40%; }
    17% { background-position: 14.286% 40%; }
    18% { background-position: 28.571% 40%; }
    19% { background-position: 42.857% 40%; }
    20% { background-position: 57.143% 40%; }
    21% { background-position: 71.429% 40%; }
    22% { background-position: 85.714% 40%; }
    23% { background-position: 100% 40%; }
    24% { background-position: 0% 60%; }
    25% { background-position: 14.286% 60%; }
    26% { background-position: 28.571% 60%; }
    27% { background-position: 42.857% 60%; }
    28% { background-position: 57.143% 60%; }
    29% { background-position: 71.429% 60%; }
    30% { background-position: 85.714% 60%; }
    31% { background-position: 100% 60%; }
    32% { background-position: 0% 80%; }
    33% { background-position: 14.286% 80%; }
    34% { background-position: 28.571% 80%; }
    35% { background-position: 42.857% 80%; }
    36% { background-position: 57.143% 80%; }
    37% { background-position: 71.429% 80%; }
    38% { background-position: 85.714% 80%; }
    39% { background-position: 100% 80%; }
    40% { background-position: 0% 100%; }
    41% { background-position: 14.286% 100%; }
    42% { background-position: 28.571% 100%; }
    43% { background-position: 42.857% 100%; }
    44% { background-position: 57.143% 100%; }
    100% { background-position: 57.143% 100%; }
  }

  .headline {
    font-size: 24px;
    font-weight: 600;
    margin: 20px 0 8px;
  }
  .headline .accent {
    background: linear-gradient(90deg, #6fa8ff, #3b82f6);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    font-family: 'Caveat', cursive;
    font-size: 1.15em;
  }
  .sub {
    color: #9ca3af;
    font-size: 15px;
    line-height: 1.5;
  }

  .ask {
    color: #6b7280;
    font-size: 13px;
    margin: 20px 0 12px;
  }

  .buttons {
    display: flex;
    gap: 12px;
    justify-content: center;
    margin-bottom: 40px;
  }
  .btn {
    padding: 12px 26px;
    border-radius: 999px;
    border: 1px solid rgba(255,255,255,0.18);
    background: transparent;
    color: #fff;
    font-size: 15px;
    font-weight: 500;
    cursor: pointer;
    transition: background .15s, border-color .15s;
  }
  .btn:hover { background: rgba(255,255,255,0.08); }
  .btn.primary {
    background: #1f2937;
    border-color: #374151;
  }
  .btn.primary:hover { background: #283544; }

  .inputbar {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 16px 20px calc(16px + env(safe-area-inset-bottom));
    z-index: 10;
  }
  .inputbar input {
    flex: 1;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 999px;
    padding: 14px 20px;
    color: #fff;
    font-size: 15px;
    outline: none;
  }
  .inputbar input::placeholder { color: #6b7280; }
  .send {
    width: 46px; height: 46px;
    background: #3b82f6;
    border: none;
    border-radius: 50%;
    color: #fff;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
  }
  .send svg { width: 22px; height: 22px; }
</style>
</head>
<body>

  <div class="topbar">
    <button class="icon-btn" title="Звук" id="muteBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><line x1="23" y1="9" x2="17" y2="15"></line><line x1="17" y1="9" x2="23" y2="15"></line></svg>
    </button>
    <button class="icon-btn" title="Тема">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
    </button>
  </div>

  <div class="content">
    <div class="brand">SIGNAL</div>

    <div class="logo" role="img" aria-label="Маскот Signal"></div>

    <div class="headline">Привет, это <span class="accent">Signal</span> —<br>все твои новости в одном месте</div>
    <div class="sub">новости, мессенджер и уведомления<br>в одном месте</div>

    <div class="ask">расскажи, ты уже пользовался сервисом или ты новичёк?</div>

    <div class="buttons">
      <button class="btn">Да, пользовался</button>
      <button class="btn primary">Нет, я новичёк</button>
    </div>
  </div>

  <div class="inputbar">
    <input type="text" placeholder="Сообщение">
    <button class="send" title="Отправить">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"></line><polyline points="5 12 12 5 19 12"></polyline></svg>
    </button>
  </div>

  <script>
    const btn = document.getElementById('muteBtn');
    let muted = true;
    btn.addEventListener('click', () => {
      muted = !muted;
      btn.style.opacity = muted ? '0.6' : '1';
    });
    document.querySelector('.send').addEventListener('click', () => {
      const input = document.querySelector('.inputbar input');
      if (input.value.trim()) { input.value = ''; }
    });
  </script>
</body>
</html>
