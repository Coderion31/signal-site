<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SIGNAL</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  :root {
    --bg: #000;
    --fg: #fff;
    --muted: #9ca3af;
    --muted2: #6b7280;
    --icon-bg: rgba(255,255,255,0.08);
    --btn-border: rgba(255,255,255,0.18);
    --btn-hover: rgba(255,255,255,0.08);
    --btn-primary-bg: #1f2937;
    --btn-primary-border: #374151;
    --btn-primary-hover: #283544;
    --input-bg: rgba(255,255,255,0.08);
    --input-border: rgba(255,255,255,0.12);
    --mascot-src: url('mascot-dark.svg');
    --accent-a: #6fa8ff;
    --accent-b: #3b82f6;
  }
  body[data-theme="light"] {
    --bg: #f5f6f8;
    --fg: #0b0f14;
    --muted: #4b5563;
    --muted2: #6b7280;
    --icon-bg: rgba(0,0,0,0.06);
    --btn-border: rgba(0,0,0,0.15);
    --btn-hover: rgba(0,0,0,0.06);
    --btn-primary-bg: #e5e7eb;
    --btn-primary-border: #d1d5db;
    --btn-primary-hover: #d1d5db;
    --input-bg: rgba(0,0,0,0.05);
    --input-border: rgba(0,0,0,0.12);
    --mascot-src: url('mascot.svg');
  }
  body {
    font-family: 'Inter', sans-serif;
    background: var(--bg);
    color: var(--fg);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    overflow: hidden;
    transition: background .25s, color .25s;
  }

  .topbar {
    position: fixed;
    top: 0; left: 0; right: 0;
    display: flex;
    justify-content: flex-end;
    padding: 16px 20px;
    gap: 12px;
    z-index: 10;
  }
  .icon-btn {
    width: 38px; height: 38px;
    background: var(--icon-bg);
    border: none;
    border-radius: 50%;
    color: var(--fg);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    transition: opacity .15s;
  }
  .icon-btn svg { width: 20px; height: 20px; }

  .content {
    text-align: center;
    padding: 0 24px;
    max-width: 480px;
  }

  .brand {
    font-family: 'Caveat', cursive;
    font-size: 64px;
    font-weight: 600;
    background: linear-gradient(90deg, var(--accent-a), var(--accent-b));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    letter-spacing: 2px;
    margin-bottom: 8px;
    user-select: none;
  }

  .logo {
    margin: 16px auto 0;
    width: 130px; height: 130px;
    background: var(--mascot-src);
    background-size: 1064px 798px;
    background-position: 0 0;
    background-repeat: no-repeat;
    animation: mascot 5s steps(1) infinite;
    transform: translateX(-52%);
  }
  @keyframes mascot {
    0% { background-position: 0px 0px; }
    2.2222% { background-position: -133px 0px; }
    4.4444% { background-position: -266px 0px; }
    6.6667% { background-position: -399px 0px; }
    8.8889% { background-position: -532px 0px; }
    11.1111% { background-position: -665px 0px; }
    13.3333% { background-position: -798px 0px; }
    15.5555% { background-position: -931px 0px; }
    17.7778% { background-position: 0px -133px; }
    20% { background-position: -133px -133px; }
    22.2222% { background-position: -266px -133px; }
    24.4444% { background-position: -399px -133px; }
    26.6666% { background-position: -532px -133px; }
    28.8889% { background-position: -665px -133px; }
    31.1111% { background-position: -798px -133px; }
    33.3333% { background-position: -931px -133px; }
    35.5555% { background-position: 0px -266px; }
    37.7777% { background-position: -133px -266px; }
    40% { background-position: -266px -266px; }
    42.2222% { background-position: -399px -266px; }
    44.4444% { background-position: -532px -266px; }
    46.6666% { background-position: -665px -266px; }
    48.8888% { background-position: -798px -266px; }
    51.1111% { background-position: -931px -266px; }
    53.3333% { background-position: 0px -399px; }
    55.5555% { background-position: -133px -399px; }
    57.7777% { background-position: -266px -399px; }
    59.9999% { background-position: -399px -399px; }
    62.2222% { background-position: -532px -399px; }
    64.4444% { background-position: -665px -399px; }
    66.6666% { background-position: -798px -399px; }
    68.8888% { background-position: -931px -399px; }
    71.1111% { background-position: 0px -532px; }
    73.3333% { background-position: -133px -532px; }
    75.5555% { background-position: -266px -532px; }
    77.7777% { background-position: -399px -532px; }
    79.9999% { background-position: -532px -532px; }
    82.2222% { background-position: -665px -532px; }
    84.4444% { background-position: -798px -532px; }
    86.6666% { background-position: -931px -532px; }
    88.8888% { background-position: 0px -665px; }
    91.1111% { background-position: -133px -665px; }
    93.3333% { background-position: -266px -665px; }
    95.5555% { background-position: -399px -665px; }
    97.7777% { background-position: -532px -665px; }
    100% { background-position: -532px -665px; }
  }

  .headline {
    font-size: 24px;
    font-weight: 600;
    margin: 20px 0 8px;
  }
  .headline .accent {
    background: linear-gradient(90deg, var(--accent-a), var(--accent-b));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    font-family: 'Caveat', cursive;
    font-size: 1.15em;
  }
  .sub {
    color: var(--muted);
    font-size: 15px;
    line-height: 1.5;
  }

  .ask {
    color: var(--muted2);
    font-size: 13px;
    margin: 20px 0 12px;
  }

  .buttons {
    display: flex;
    gap: 12px;
    justify-content: center;
    margin-bottom: 40px;
  }
  .btn {
    padding: 12px 26px;
    border-radius: 999px;
    border: 1px solid var(--btn-border);
    background: transparent;
    color: var(--fg);
    font-size: 15px;
    font-weight: 500;
    cursor: pointer;
    transition: background .15s, border-color .15s;
  }
  .btn:hover { background: var(--btn-hover); }
  .btn.primary {
    background: var(--btn-primary-bg);
    border-color: var(--btn-primary-border);
  }
  .btn.primary:hover { background: var(--btn-primary-hover); }

  .inputbar {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 16px 20px calc(16px + env(safe-area-inset-bottom));
    z-index: 10;
  }
  .inputbar input {
    flex: 1;
    background: var(--input-bg);
    border: 1px solid var(--input-border);
    border-radius: 999px;
    padding: 14px 20px;
    color: var(--fg);
    font-size: 15px;
    outline: none;
  }
  .inputbar input::placeholder { color: var(--muted2); }
  .send {
    width: 46px; height: 46px;
    background: #3b82f6;
    border: none;
    border-radius: 50%;
    color: #fff;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
  }
  .send svg { width: 22px; height: 22px; }
</style>
</head>
<body data-theme="dark">

  <div class="topbar">
    <button class="icon-btn" title="Звук" id="muteBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><line x1="23" y1="9" x2="17" y2="15"></line><line x1="17" y1="9" x2="23" y2="15"></line></svg>
    </button>
    <button class="icon-btn" title="Переключить тему" id="themeBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
    </button>
  </div>

  <div class="content">
    <div class="brand">SIGNAL</div>

    <div class="logo" role="img" aria-label="Маскот Signal"></div>

    <div class="headline">Привет, это <span class="accent">Signal</span> —<br>все твои новости в одном месте</div>
    <div class="sub">новости, мессенджер и уведомления<br>в одном месте</div>

    <div class="ask">расскажи, ты уже пользовался сервисом или ты новичёк?</div>

    <div class="buttons">
      <button class="btn">Да, пользовался</button>
      <button class="btn primary">Нет, я новичёк</button>
    </div>
  </div>

  <div class="inputbar">
    <input type="text" placeholder="Сообщение">
    <button class="send" title="Отправить">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"></line><polyline points="5 12 12 5 19 12"></polyline></svg>
    </button>
  </div>

  <script>
    const btn = document.getElementById('muteBtn');
    let muted = true;
    btn.addEventListener('click', () => {
      muted = !muted;
      btn.style.opacity = muted ? '0.6' : '1';
    });
    document.querySelector('.send').addEventListener('click', () => {
      const input = document.querySelector('.inputbar input');
      if (input.value.trim()) { input.value = ''; }
    });
    const themeBtn = document.getElementById('themeBtn');
    let saved = localStorage.getItem('signal-theme');
    if (saved) document.body.setAttribute('data-theme', saved);
    themeBtn.addEventListener('click', () => {
      const cur = document.body.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      document.body.setAttribute('data-theme', cur);
      localStorage.setItem('signal-theme', cur);
    });
  </script>
</body>
</html>
